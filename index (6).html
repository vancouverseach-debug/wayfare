<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Wayfare — Italy & Greece</title>
<style>
  :root{
    --ink:#0E5C63; --ink-dark:#0A4348; --paper:#F6F3EC; --card:#FFFFFF;
    --sand:#F4EFE6; --line:#E0DACE; --line2:#EFEBE1; --clay:#B5643C;
    --ok:#3B7A57; --text:#2C2A29; --muted:#5A5552; --sandbrass:#CBB893;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100vh;background:var(--paper);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  h1,h2,h3,h4{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  a{color:var(--ink);text-decoration:none;}
  .app{min-height:100vh;padding-bottom:76px;max-width:720px;margin:0 auto;}

  /* header */
  header{position:sticky;top:0;z-index:40;background:rgba(246,243,236,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;}
  .brandrow{display:flex;align-items:center;gap:10px;}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
  .brand h1{font-size:19px;color:var(--ink-dark);letter-spacing:-.3px;}
  .brand p{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}

  /* subtabs */
  .subtabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;}
  .subtab{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;
    white-space:nowrap;color:var(--muted);background:var(--card);border:1px solid var(--line);}
  .subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  main{padding:16px;}

  /* day nav */
  .daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .navbtn{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);flex-shrink:0;}
  .navbtn:disabled{opacity:.3;}
  .todaybtn{height:34px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:700;
    background:rgba(14,92,99,.1);color:var(--ink);flex-shrink:0;}
  .citychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .citychip{height:34px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;
    white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);flex-shrink:0;}
  .citychip.active{background:var(--ink-dark);color:#fff;}

  .daystrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .daycard{flex-shrink:0;min-width:104px;padding:10px 14px;border-radius:14px;text-align:left;
    background:var(--card);border:1px solid var(--line);scroll-snap-align:center;}
  .daycard.active{background:var(--ink);border-color:var(--ink);}
  .daycard .dlabel{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .daycard.active .dlabel{color:var(--sandbrass);}
  .daycard .dcity{font-size:13px;font-weight:700;margin-top:3px;color:var(--text);}
  .daycard.active .dcity{color:#fff;}
  .todot{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block;}
  .daycard.active .todot{background:var(--sandbrass);}

  /* day header */
  .dayhead{display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:12px;margin:16px 0 14px;border-bottom:1px solid var(--line);}
  .dayhead .dtitle{font-size:22px;font-weight:600;}
  .dayhead .dsub{font-size:13px;color:var(--muted);margin-top:2px;}
  .stopcount{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap;}

  /* anchor (bookings bookends) */
  .anchor{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
    background:var(--ink-dark);color:#fff;margin-bottom:8px;}
  .anchor .albl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    background:var(--sandbrass);color:var(--ink-dark);padding:2px 6px;border-radius:5px;}
  .anchor .atitle{font-weight:600;font-size:13px;}
  .anchor .aaddr{font-size:11px;opacity:.8;margin-top:2px;}
  .anchor .atime{font-size:12px;font-weight:700;text-align:right;}
  .anchor .aconf{font-size:10px;opacity:.7;text-align:right;margin-top:2px;}

  /* timeline stop */
  .stop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;
    box-shadow:0 1px 2px rgba(30,42,46,.05);}
  .stop.reserved{border-left:3px solid var(--ok);}
  .stoptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .catdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .stoptime{font-size:13px;font-weight:700;color:var(--text);}
  .stopdur{font-weight:600;color:var(--muted);}
  .stopactions{display:flex;gap:5px;margin-left:auto;}
  .iconbtn{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);}
  .iconbtn:disabled{opacity:.3;}
  .stopmenu{margin-top:10px;padding:10px;border-radius:12px;background:var(--paper);border:1px solid var(--line);}
  .menurow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);}
  .menurow input,.menurow select{font-size:12px;font-weight:700;border-radius:8px;border:1px solid var(--line);background:#fff;padding:5px 7px;color:var(--text);}
  .movesel{max-width:150px;}
  .menuremove{width:100%;margin-top:6px;padding:9px;border-radius:9px;background:#FBEEE7;color:var(--clay);font-size:12px;font-weight:700;text-align:center;}
  .stopname{font-weight:700;font-size:15px;margin-bottom:3px;}
  .stopname.done{text-decoration:line-through;color:var(--muted);}
  .stopnote{font-size:12px;color:var(--muted);}
  .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;}
  .badge.res{background:var(--ok);color:#fff;}
  .badge.now{background:var(--ink);color:#fff;}
  .badge.soon{background:var(--sandbrass);color:var(--ink-dark);}
  .stoplinks{display:flex;gap:14px;margin-top:8px;}
  .stoplink{font-size:12px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;}
  .stoplink.rm{color:var(--muted);}
  .transit{font-size:11px;color:var(--muted);padding:3px 0 3px 34px;}

  .addbtn{width:100%;padding:12px;border-radius:12px;background:rgba(14,92,99,.09);
    color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;}

  .fab{position:fixed;right:18px;bottom:88px;z-index:45;width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 28px rgba(14,92,99,.4);}
  .fab:active{transform:scale(.94);}

  .empty{text-align:center;padding:40px 20px;border-radius:18px;background:var(--sand);}
  .empty .etitle{font-size:18px;font-weight:600;margin-bottom:4px;}
  .empty .esub{font-size:13px;color:var(--muted);max-width:300px;margin:0 auto;line-height:1.5;}

  /* cards / accordions */
  .card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(30,42,46,.06);margin-bottom:14px;overflow:hidden;}
  .acchead{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;}
  .acchead .aicon{width:36px;height:36px;border-radius:11px;background:rgba(14,92,99,.1);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .acchead .atitle{font-size:15px;font-weight:700;}
  .acchead .acount{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:2px;}
  .acchead .chev{margin-left:auto;font-size:16px;color:var(--muted);transition:transform .2s;}
  .acchead .chev.open{transform:rotate(90deg);}
  .accbody{padding:0 12px 12px;}
  .brow{display:flex;align-items:flex-start;gap:14px;padding:14px;border-radius:12px;background:var(--paper);margin-bottom:8px;}
  .brow .bic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .brow .btitle{font-size:14px;font-weight:700;}
  .brow .baddr{font-size:12px;color:var(--muted);margin-top:2px;}
  .confpill{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;background:var(--ink);
    color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;}
  .confpill.pending{background:var(--clay);}
  .bmeta{text-align:right;flex-shrink:0;}
  .bmeta .bdate{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .bmeta .btime{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;}

  /* dinners */
  .dinner{padding:14px;border-bottom:1px solid var(--line2);}
  .dinner:last-child{border-bottom:none;}
  .dinnertop{display:flex;gap:12px;margin-bottom:10px;}
  .dinnername{font-size:14px;font-weight:700;}
  .dinnermeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0;}
  .dinnermeta select,.dinnermeta input{font-size:12px;font-weight:600;border-radius:6px;
    padding:2px 6px;background:rgba(14,92,99,.08);color:var(--ink);border:1px solid rgba(14,92,99,.2);}
  .dinnerquirk{font-size:12px;color:var(--muted);}
  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--line2);}
  .segbtn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;}
  .segbtn.want{background:var(--ink);color:#fff;}
  .segbtn.requested{background:var(--clay);color:#fff;}
  .segbtn.confirmed{background:var(--ok);color:#fff;}

  /* todo */
  .todo{display:flex;align-items:flex-start;gap:12px;padding:14px;border-bottom:1px solid var(--line2);width:100%;text-align:left;}
  .todo:last-child{border-bottom:none;}
  .todobox{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;}
  .todo.done .todobox{background:var(--ok);border-color:var(--ok);color:#fff;}
  .todo.urgent .todobox{border-color:var(--clay);}
  .todotext{font-size:14px;font-weight:600;}
  .todo.done .todotext{text-decoration:line-through;color:var(--muted);}
  .tododetail{font-size:12px;color:var(--muted);margin-top:2px;}
  .urgentflag{font-size:10px;font-weight:700;color:var(--clay);text-transform:uppercase;letter-spacing:.5px;}

  /* guides */
  .guidepick{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line2);}
  .guidepick:last-child{border-bottom:none;}
  .guidetag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff;padding:2px 6px;border-radius:5px;}
  .guidename{font-size:14px;font-weight:700;margin-top:4px;}
  .guidetip{font-size:12px;color:var(--muted);margin-top:2px;}

  /* budget */
  .bnum{display:flex;justify-content:space-between;margin-bottom:14px;}
  .bnum .bl{font-size:12px;color:var(--muted);}
  .bnum .bv{font-size:22px;font-weight:800;}
  .bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;margin-bottom:14px;}
  .bar>div{height:100%;background:var(--ink);}
  .catbar{margin-bottom:12px;}
  .catbar .cl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .catbar .ct{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;}

  /* section title */
  .sectitle{font-size:24px;font-weight:600;margin-bottom:4px;}
  .secsub{font-size:14px;color:var(--muted);margin-bottom:18px;}

  /* bottom nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--card);
    border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:40;max-width:720px;margin:0 auto;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);position:relative;padding:6px 10px;}
  .navitem.active{color:var(--ink);}
  .navitem .ni{font-size:20px;}
  .navbadge{position:absolute;top:0;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
    background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* modal */
  .modalwrap{position:fixed;inset:0;z-index:60;background:rgba(10,20,22,.55);display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
  @media(min-width:600px){.modalwrap{align-items:center;}.modal{border-radius:24px;}}
  .modal h3{font-size:20px;font-weight:600;margin-bottom:12px;}
  .modal label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:6px;}
  .modal input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14px;outline:none;margin-bottom:14px;}
  .catrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .catopt{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--muted);}
  .catopt.active{background:var(--ink);color:#fff;}
  .modalbtns{display:flex;gap:10px;}
  .btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:var(--line2);color:var(--muted);}
  .dayopts{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .dayopt{flex-shrink:0;min-width:88px;padding:10px;border-radius:12px;text-align:left;background:var(--paper);border:1px solid var(--line);}
  .dayopt.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .dayopt .dol{font-size:11px;color:var(--muted);}
  .dayopt.active .dol{color:var(--sandbrass);}
  .dayopt .doc{font-size:13px;font-weight:700;margin-top:2px;}
  .slotrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .slotopt{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--muted);}
  .slotopt.active{background:var(--ink);color:#fff;}

  /* toast */
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:70;
    background:var(--ink-dark);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;
    box-shadow:0 8px 28px rgba(10,20,22,.4);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}

  /* debug pill */
  .debug{position:fixed;left:12px;bottom:80px;z-index:50;}
  .debugpill{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ink-dark);color:#fff;box-shadow:0 6px 20px rgba(10,20,22,.3);}
  .debugpill.on{background:var(--clay);}
  .debugpanel{position:absolute;bottom:44px;left:0;width:230px;background:var(--ink-dark);color:#fff;border-radius:16px;padding:12px;box-shadow:0 12px 40px rgba(10,20,22,.4);}
  .debugpanel .dg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:160px;overflow-y:auto;}
  .debugpanel .dgb{padding:6px 2px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:#fff;text-align:center;}
  .debugpanel .dgb.on{background:var(--sandbrass);color:var(--ink-dark);}
  .debugpanel .dclose{width:100%;margin-top:8px;padding:8px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:700;}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="toast" class="toast"></div>
<script>

  {day:28, city:"Athens", title:"Fly home", date:"Sep 14", items:[]}
];

var S = {
  tab:"trips", sub:"plan", dayIdx:2,
  itin:null, bookings:null, dinners:null, todos:null,

/* ---------- persistence ---------- */
function load(){
  try{ var raw=localStorage.getItem(STORE); if(raw){ return JSON.parse(raw); } }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({itin:S.itin,bookings:S.bookings,dinners:S.dinners,todos:S.todos})); }catch(e){}
}
function initState(){
  var d=load()||{};
  S.itin = d.itin || clone(ITIN_SEED);
  S.bookings = d.bookings || clone(BOOKINGS_SEED);
  S.dinners = d.dinners || clone(DINNERS_SEED);
  S.todos = d.todos || clone(TODO_SEED);
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function mkDate(str){ var m=String(str).match(/([A-Z][a-z]{2})\s+(\d{1,2})/); if(!m)return null; return new Date(2026, MONTHS[m[1]], +m[2]); }
function effNow(){
  if(S.spoof){ var d=mkDate(S.spoof); var r=new Date(); if(d){ d.setHours(r.getHours(),r.getMinutes(),0,0); return d; } }
  return new Date();
}
function todayDayNum(){
  var t=new Date(effNow()); t.setHours(0,0,0,0);
  for(var i=0;i<S.itin.length;i++){ var dd=mkDate(S.itin[i].date); if(dd && dd.getTime()===t.getTime()) return S.itin[i].day; }
  return null;
}
function toMin(t){ var p=String(t).split(":"); return (+p[0])*60+(+p[1]||0); }
function catMeta(c){ return CAT[c]||CAT.culture; }
function showToast(msg){
  var el=document.getElementById("toast");
  el.innerHTML="✓&nbsp;&nbsp;"+esc(msg); el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove("show"); },2000);
}

/* ---------- bookings → day anchors ---------- */
function anchorsForDay(day){
  var t=mkDate(day.date); var out={arrivals:[],departures:[],checkin:null,checkout:null};
  if(!t)return out; var tt=t.getTime();
  S.bookings.forEach(function(b){
    var range=String(b.date).split("–");
    if(range.length===2){
      var s=mkDate(range[0].trim());
      var e2=range[1].trim();
      // handle shorthand ranges like "Aug 23–28" — infer month from the start date
      var e = /^[A-Z][a-z]{2}\s/.test(e2) ? mkDate(e2) : (function(){ var mo=String(range[0]).match(/[A-Z][a-z]{2}/); return mo ? mkDate(mo[0]+" "+e2) : null; })();
      if(b.type==="Stays"){
        if(s&&s.getTime()===tt) out.checkin=b;
        else if(e&&e.getTime()===tt&&!out.checkout) out.checkout=b;
      } else if(b.type==="Cars"){
        // car rentals: pickup day = arrival-style anchor, drop-off day = departure-style
        if(s&&s.getTime()===tt) out.arrivals.push(b);
        else if(e&&e.getTime()===tt) out.departures.push(Object.assign({}, b, {time:b.dropTime||""}));
      }
      return;
    }
    var d=mkDate(b.date); if(!d||d.getTime()!==tt) return;
    if(b.type==="Flights"||b.type==="Ferries"||b.type==="Buses"||b.type==="Cars"){
      var hh=parseInt(String(b.time).split(":")[0],10)||12;
      if(hh>=16) out.departures.push(b); else out.arrivals.push(b);
    }
  });
  return out;
}

/* ======================================================= RENDER */
function render(){
  var root=document.getElementById("root");
  var html = header() ;
  if(S.tab==="trips") html += tripsView();
  else if(S.tab==="live") html += liveView();
  else if(S.tab==="guides") html += guidesView();
  else if(S.tab==="saved") html += savedView();
  else if(S.tab==="passport") html += passportView();
  if(S.tab==="trips" && S.sub==="plan") html += '<button class="fab" data-fabadd="1" title="Add a stop">＋</button>';
  html += bottomNav();
  html += debugPill();
  if(S.addOpen) html += addModal();
  if(S.bookOpen) html += bookModal();
  root.innerHTML = html;
  bind();
}

function header(){
  return '<header><div class="brandrow">'+
    '<div class="logo serif">W</div>'+
    '<div class="brand"><h1 class="serif">Wayfare</h1>'+
    '<p>Italy &amp; Greece · Aug 17–Sep 14</p></div></div></header>';
}

function bottomNav(){
  var saved= S.dinners.filter(function(d){return d.status!=="confirmed";}).length;
  var open= S.todos.filter(function(t){return !t.done;}).length;
  var items=[["trips","🧭","Trips",open],["live","⚡","Live",0],["guides","🗺️","Guides",0],["saved","🔖","Saved",0],["passport","🛡️","Passport",0]];
  return '<nav class="bottom">'+items.map(function(it){
    var badge= it[3]>0 ? '<span class="navbadge">'+it[3]+'</span>' : '';
    return '<button class="navitem'+(S.tab===it[0]?' active':'')+'" data-tab="'+it[0]+'">'+
      badge+'<span class="ni">'+it[1]+'</span>'+it[2]+'</button>';
  }).join('')+'</nav>';
}

/* ---------- TRIPS ---------- */
function tripsView(){
  var subs=[["plan","Timeline"],["bookings","Bookings"],["budget","Budget"]];
  var h='<div class="subtabs">'+subs.map(function(s){
    return '<button class="subtab'+(S.sub===s[0]?' active':'')+'" data-sub="'+s[0]+'">'+s[1]+'</button>';
  }).join('')+'</div><main>';
  if(S.sub==="plan") h+=planView();
  else if(S.sub==="bookings") h+=bookingsView();
  else if(S.sub==="budget") h+=budgetView();
  h+='</main>';
  return h;
}

function planView(){
  var today=todayDayNum();
  // top nav: today jump + city chips (day strip removed — days are now inline accordions below)
  var h='<div class="daynav">';
  if(today!=null){ h+='<button class="todaybtn" data-today="1"><span class="todot"></span> Jump to today</button>'; }
  var seen={},cities=[];
  S.itin.forEach(function(d){ if(!seen[d.city]){seen[d.city]=1;cities.push(d);} });
  h+='<div class="citychips">'+cities.map(function(d){
    return '<button class="citychip" data-cityday="'+d.day+'">'+esc(d.city)+'</button>';
  }).join('')+'</div></div>';

  // every day as a collapsible accordion. open = current/selected day by default.
  S.itin.forEach(function(day,i){
    var isOpen = S.openDays[day.day] !== undefined ? S.openDays[day.day] : (i===S.dayIdx);
    var dot = today===day.day ? '<span class="todot"></span>' : '';
    h+='<div class="card daycard-acc" data-day="'+day.day+'">'+
      '<button class="acchead" data-daytoggle="'+day.day+'">'+
        '<div style="flex:1;text-align:left">'+
          '<div class="dlabel" style="margin-bottom:2px">Day '+day.day+' · '+esc(day.date)+' · '+esc(day.city)+' '+dot+'</div>'+
          '<div style="font-size:15px;font-weight:700;color:var(--text)">'+esc(day.title)+'</div>'+
        '</div>'+
        '<span class="stopcount" style="margin-right:8px">'+day.items.length+'</span>'+
        '<span class="chev'+(isOpen?' open':'')+'">›</span>'+
      '</button>';
    if(isOpen){
      h+='<div class="accbody" style="padding-top:4px">';
      var a=anchorsForDay(day);
      a.arrivals.forEach(function(b){ h+=anchorRow(b, b.type==="Cars" ? "Car pickup" : "Arrive"); });
      if(a.checkin) h+=anchorRow(a.checkin,"Check in");
      if(day.items.length===0){
        h+='<div class="empty"><div class="etitle serif">An open day in '+esc(day.city)+'</div>'+
          '<div class="esub">Nothing scheduled yet. Add a spot below, or confirm a dinner to drop it here.</div></div>';
      } else {
        var now = today===day.day ? (effNow().getHours()*60+effNow().getMinutes()) : null;
        day.items.forEach(function(it,idx){ h+=stopRow(day,it,idx,now,i); });
      }
      if(a.checkout) h+=anchorRow(a.checkout,"Check out");
      a.departures.forEach(function(b){ h+=anchorRow(b, b.type==="Cars" ? "Car drop-off" : "Depart"); });
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}

function anchorRow(b,label){
  var icon = b.type==="Cars" ? "🚗" : b.type==="Flights" ? "✈️" : b.type==="Ferries" ? "⛴️" : b.type==="Buses" ? "🚌" : b.type==="Stays" ? "🛏️" : "📍";
  return '<div class="anchor"><span style="font-size:16px;flex-shrink:0">'+icon+'</span><div style="flex:1;min-width:0">'+
    '<div><span class="albl">'+label+'</span> <span class="atitle">'+esc(b.title)+'</span></div>'+
    '<div class="aaddr">'+esc(b.addr)+'</div></div>'+
    '<div><div class="atime">'+esc(b.time&&b.time!=="—"?b.time:"")+'</div>'+
    '<div class="aconf">'+esc(b.conf)+'</div></div></div>';
}

function stopRow(day,it,idx,now){
  var m=catMeta(it.cat);
  var start=toMin(it.time), end=start+(it.dur||60);
  var done=false, badge="";
  if(now!=null){
    if(now>=end) done=true;
    else if(now>=start) badge='<span class="badge now">● NOW</span>';
    else if(start-now<=90) badge='<span class="badge soon">in '+(start-now)+'m</span>';
  }
  var mapq = encodeURIComponent(it.name+" "+day.city);
  var menuId = "m_"+day.day+"_"+idx;
  return '<div class="stop'+(it.reserved?' reserved':'')+'" data-idx="'+idx+'" data-day="'+day.day+'">'+
    '<div class="stoptop">'+
      '<span class="catdot" style="background:'+m.bg+'">'+m.emoji+'</span>'+
      '<span class="stoptime">'+esc(it.time)+' <span class="stopdur">· '+(it.dur||60)+'m</span></span>'+
      '<span class="stopactions">'+
        '<button class="iconbtn" data-menutoggle="'+menuId+'" title="Options">⋮</button>'+
      '</span>'+
    '</div>'+
    '<div class="stopname'+(done?' done':'')+'">'+esc(it.name)+
      (it.reserved?' <span class="badge res">Reserved</span>':'')+' '+badge+'</div>'+
    (it.note?'<div class="stopnote">'+esc(it.note)+'</div>':'')+
    '<div class="stoplinks">'+
      '<a class="stoplink" href="https://www.google.com/maps/search/?api=1&query='+mapq+'" target="_blank" rel="noreferrer">➤ Directions</a>'+
    '</div>'+
    '<div class="stopmenu" id="'+menuId+'" style="display:'+(S.openMenu===menuId?'block':'none')+'">'+
      '<div class="menurow"><span>Time</span><input type="time" value="'+esc(it.time)+'" data-time="'+idx+'" data-day="'+day.day+'"></div>'+
      '<div class="menurow"><span>Duration</span><select data-dur="'+idx+'" data-day="'+day.day+'">'+
        [[30,"30m"],[60,"1h"],[90,"1.5h"],[120,"2h"],[180,"3h"]].map(function(d){
          return '<option value="'+d[0]+'"'+(it.dur===d[0]?' selected':'')+'>'+d[1]+'</option>';
        }).join('')+'</select></div>'+
      '<div class="menurow"><span>Move to</span><select class="movesel" data-move="'+idx+'" data-day="'+day.day+'">'+
        '<option value="">Choose a day…</option>'+
        S.itin.map(function(d){ return '<option value="'+d.day+'"'+(d.day===day.day?' selected':'')+'>Day '+d.day+' · '+esc(d.city)+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="menurow"><span>Reorder</span><span style="display:flex;gap:6px">'+
        '<button class="iconbtn" data-up="'+idx+'" data-day="'+day.day+'"'+(idx===0?' disabled':'')+'>↑</button>'+
        '<button class="iconbtn" data-down="'+idx+'" data-day="'+day.day+'"'+(idx===day.items.length-1?' disabled':'')+'>↓</button>'+
      '</span></div>'+
      '<button class="menuremove" data-remove="'+idx+'" data-day="'+day.day+'">✕ Remove from day</button>'+
    '</div>'+
  '</div>';
}

function liveView(){
  var today=todayDayNum();
  var h='<main>';
  if(today==null){
    var first=S.itin[0]; var days=Math.round((mkDate(first.date)-new Date())/86400000);
    h+='<div class="card" style="padding:24px;background:var(--ink-dark);color:#fff">'+
      '<div class="acount" style="color:var(--sandbrass)">Countdown</div>'+
      '<div class="serif" style="font-size:30px;font-weight:600;margin:6px 0">'+(days>0?days+' days to Naples':'Trip starting')+'</div>'+
      '<div style="opacity:.8;font-size:14px">Day 1 · '+esc(first.title)+' · '+esc(first.date)+'</div>'+
      '<div style="opacity:.7;font-size:12px;margin-top:10px">Use the Debug pill (bottom-left) to spoof a trip day and preview the live view.</div></div>';
    h+='</main>'; return h;
  }
  var day=null; for(var i=0;i<S.itin.length;i++){ if(S.itin[i].day===today){ day=S.itin[i]; break; } }
  var now=effNow().getHours()*60+effNow().getMinutes();
  var clock=effNow().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  h+='<div class="acount">Live · '+esc(day.city)+'</div>'+
     '<div class="serif" style="font-size:32px;font-weight:600">Right now</div>'+
     '<div class="secsub">Day '+day.day+' · '+esc(day.title)+' · '+esc(day.date)+'</div>';
  h+='<div class="card" style="padding:14px;display:flex;align-items:center;gap:10px;background:rgba(14,92,99,.08)">'+
     '🕐 <div><div class="serif" style="font-size:20px;color:var(--ink)">'+clock+'</div>'+
     '<div style="font-size:11px;color:var(--muted)">your local time'+(S.spoof?' (spoofed)':'')+'</div></div></div>';
  var cur=null,nxt=null;
  for(var j=0;j<day.items.length;j++){ var s=toMin(day.items[j].time),e=s+(day.items[j].dur||60);
    if(now<e){ if(now>=s)cur=day.items[j]; nxt=day.items[j+1]||null; if(now<s)nxt=day.items[j]; break; } }
  if(cur){ h+='<div class="card" style="padding:18px;background:var(--ink-dark);color:#fff">'+
    '<div class="acount" style="color:var(--sandbrass)">Now</div>'+
    '<div class="serif" style="font-size:24px;margin:4px 0">'+esc(cur.name)+'</div>'+
    '<div style="opacity:.85;font-size:13px">'+esc(cur.time)+(cur.note?' · '+esc(cur.note):'')+'</div></div>'; }
  else if(day.items.length){ h+='<div class="card" style="padding:20px;text-align:center"><div style="font-size:15px;font-weight:600">That\'s a wrap on '+esc(day.city)+' today.</div></div>'; }
  if(nxt){ h+='<div class="card" style="padding:14px"><div class="acount">Next</div>'+
    '<div style="font-weight:700;font-size:15px;margin-top:2px">'+esc(nxt.name)+'</div>'+
    '<div style="font-size:12px;color:var(--muted)">'+esc(nxt.time)+'</div></div>'; }
  if(day.items.length===0){ h+='<div class="empty"><div class="etitle serif">Nothing scheduled today</div><div class="esub">Open the day in Trips to plan it.</div></div>'; }
  h+='</main>'; return h;
}

/* ======================================================= ACTIONS */
function setDayIdx(i){ if(i<0||i>=S.itin.length)return; S.dayIdx=i; S.openDays[S.itin[i].day]=true; render(); scrollActiveDay(); }
function scrollActiveDay(){
  try{
    var dn = S.itin[S.dayIdx] && S.itin[S.dayIdx].day;
    if(dn==null) return;
    var el=document.querySelector('.daycard-acc[data-day="'+dn+'"]');
    if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){}
}
function moveItemInDay(dayNum,idx,dir){
  var di=dayIndexByNumber(dayNum); if(di<0)return;
  var items=S.itin[di].items; var t=dir==="up"?idx-1:idx+1;
  if(t<0||t>=items.length)return;
  var tmp=items[idx]; items[idx]=items[t]; items[t]=tmp; save(); render();
}
function moveToDayNum(fromDayNum,idx,toDayNum){
  toDayNum=+toDayNum;
  var fi=dayIndexByNumber(fromDayNum), ti=dayIndexByNumber(toDayNum);
  if(fi<0||ti<0)return;
  var src=S.itin[fi]; var it=src.items[idx]; if(!it)return;
  src.items=src.items.filter(function(_,x){return x!==idx;});
  S.itin[ti].items.push(it);
  S.itin[ti].items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
  S.openMenu=null; S.openDays[toDayNum]=true;
  save(); render(); showToast(it.name+" → Day "+toDayNum);
}
function removeItemFromDayNum(dayNum,idx){
  var di=dayIndexByNumber(dayNum); if(di<0)return;
  S.itin[di].items.splice(idx,1); S.openMenu=null; save(); render(); showToast("Removed");
}
function addToDay(name,cat){
  var day=S.itin[S.dayIdx];
  var times={food:"13:00",nightlife:"21:00",cafe:"10:00",nature:"11:00",culture:"15:00",shopping:"16:00"};
  var durs={food:90,nightlife:120,cafe:45,nature:150,culture:90,shopping:60};
  var t=times[cat]||"15:00";
  day.items.push({id:"u"+Date.now(),name:name,time:t,dur:durs[cat]||90,cat:cat});
  day.items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
  save(); showToast(name+" added · "+t);
}
function setDinnerStatus(id,st){
  var d=null; S.dinners.forEach(function(x){ if(x.id===id){x.status=st;d=x;} });
  if(d&&st==="confirmed"){
    var ti=-1; for(var i=0;i<S.itin.length;i++){ if(S.itin[i].day===d.day){ti=i;break;} }
    if(ti>=0){
      var pid="dinner_"+d.id;
      var exists=S.itin[ti].items.some(function(it){return it.id===pid;});
      if(!exists){
        S.itin[ti].items.push({id:pid,name:d.name,time:d.time||"20:00",dur:105,cat:"food",reserved:true,note:d.quirk});
        S.itin[ti].items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
      }
    }
    showToast(d.name+" confirmed · Day "+d.day);
  }
  save(); render();
}
function setDinnerDay(id,newDay){
  newDay=+newDay; var d=null; S.dinners.forEach(function(x){if(x.id===id)d=x;});
  if(!d)return; var oldDay=d.day; d.day=newDay;
  var match=null; S.itin.forEach(function(x){if(x.day===newDay)match=x;});
  if(match) d.city=match.city;
  if(d.status==="confirmed"&&oldDay!==newDay){
    var pid="dinner_"+d.id;
    S.itin.forEach(function(day){
      if(day.day===oldDay) day.items=day.items.filter(function(it){return it.id!==pid;});
      if(day.day===newDay && !day.items.some(function(it){return it.id===pid;})){
        day.items.push({id:pid,name:d.name,time:d.time||"20:00",dur:105,cat:"food",reserved:true,note:d.quirk});
        day.items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
      }
    });
  }
  save(); render(); showToast(d.name+" → Day "+newDay);
}
function setDinnerTime(id,time){
  var d=null; S.dinners.forEach(function(x){if(x.id===id){x.time=time;d=x;}});
  if(d&&d.status==="confirmed"){
    var pid="dinner_"+d.id;
    S.itin.forEach(function(day){ if(day.day===d.day){
      day.items.forEach(function(it){ if(it.id===pid) it.time=time; });
      day.items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
    }});
  }
  save();
}

/* ======================================================= BIND */
function dayIndexByNumber(dayNum){ for(var i=0;i<S.itin.length;i++){ if(S.itin[i].day===dayNum) return i; } return -1; }

function bind(){
  var root=document.getElementById("root");

  // tapping anywhere outside an open stop menu closes it
  if(S.openMenu){
    root.onclick=function(e){
      var t=e.target;
      var insideMenu = t.closest && t.closest(".stopmenu");
      var isToggle = t.closest && t.closest("[data-menutoggle]");
      if(!insideMenu && !isToggle){ S.openMenu=null; render(); }
    };
  }

  root.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick=function(){ S.tab=b.getAttribute("data-tab"); if(S.tab==="trips")S.sub=S.sub||"plan"; render(); }; });
  root.querySelectorAll("[data-sub]").forEach(function(b){ b.onclick=function(){ S.sub=b.getAttribute("data-sub"); render(); }; });

  // day accordions
  root.querySelectorAll("[data-daytoggle]").forEach(function(b){ b.onclick=function(){
    var dn=+b.getAttribute("data-daytoggle");
    var cur = S.openDays[dn];
    if(cur===undefined){ var i=dayIndexByNumber(dn); cur=(i===S.dayIdx); }
    S.openDays[dn]=!cur;
    S.openMenu=null;
    render();
  }; });
  root.querySelectorAll("[data-cityday]").forEach(function(b){ b.onclick=function(){
    var dn=+b.getAttribute("data-cityday"); var i=dayIndexByNumber(dn); if(i<0)return;
    S.dayIdx=i; S.openDays[dn]=true; render();
    setTimeout(function(){ var el=document.querySelector('[data-day="'+dn+'"]'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },30);
  }; });
  var tb=root.querySelector("[data-today]"); if(tb) tb.onclick=function(){
    var dn=todayDayNum(); if(dn==null)return; var i=dayIndexByNumber(dn); if(i<0)return;
    S.dayIdx=i; S.openDays[dn]=true; render();
    setTimeout(function(){ var el=document.querySelector('[data-day="'+dn+'"]'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },30);
  };

  // ⋮ per-stop menu
  root.querySelectorAll("[data-menutoggle]").forEach(function(b){ b.onclick=function(e){
    e.stopPropagation();
    var id=b.getAttribute("data-menutoggle");
    S.openMenu = S.openMenu===id ? null : id;
    render();
  }; });

  // stop edits (day-aware — every control carries the real day number)
  root.querySelectorAll("[data-time]").forEach(function(el){ el.onchange=function(){
    var day=S.itin[dayIndexByNumber(+el.getAttribute("data-day"))]; var i=+el.getAttribute("data-time");
    day.items[i].time=el.value; day.items.sort(function(a,b){return String(a.time).localeCompare(String(b.time));});
    save(); render();
  }; });
  root.querySelectorAll("[data-dur]").forEach(function(el){ el.onchange=function(){
    var day=S.itin[dayIndexByNumber(+el.getAttribute("data-day"))]; var i=+el.getAttribute("data-dur");
    day.items[i].dur=+el.value; save();
  }; });
  root.querySelectorAll("[data-up]").forEach(function(b){ b.onclick=function(){ moveItemInDay(+b.getAttribute("data-day"), +b.getAttribute("data-up"), "up"); }; });
  root.querySelectorAll("[data-down]").forEach(function(b){ b.onclick=function(){ moveItemInDay(+b.getAttribute("data-day"), +b.getAttribute("data-down"), "down"); }; });
  root.querySelectorAll("[data-remove]").forEach(function(b){ b.onclick=function(){ removeItemFromDayNum(+b.getAttribute("data-day"), +b.getAttribute("data-remove")); }; });
  root.querySelectorAll("[data-move]").forEach(function(el){ el.onchange=function(){ if(el.value) moveToDayNum(+el.getAttribute("data-day"), +el.getAttribute("data-move"), el.value); }; });

  // FAB
  var fab=root.querySelector("[data-fabadd]"); if(fab) fab.onclick=function(){ S.addOpen=true; S.addCat="food"; render(); setTimeout(function(){var n=document.getElementById("addname");if(n)n.focus();},50); };

  // add
  var ac=root.querySelector("[data-addcancel]"); if(ac) ac.onclick=function(){ S.addOpen=false; render(); };
  var abg=root.querySelector("[data-modalbg]"); if(abg) abg.onclick=function(e){ if(e.target===abg){ S.addOpen=false; render(); } };
  root.querySelectorAll("[data-addcat]").forEach(function(b){ b.onclick=function(){ S.addCat=b.getAttribute("data-addcat"); render(); setTimeout(function(){var n=document.getElementById("addname");if(n)n.focus();},20); }; });
  var acf=root.querySelector("[data-addconfirm]"); if(acf) acf.onclick=function(){
    var n=document.getElementById("addname"); var name=(n&&n.value.trim())||"New stop";
    var dsel=document.getElementById("adddayidx"); S.dayIdx = dsel ? +dsel.value : S.dayIdx;
    S.openDays[S.itin[S.dayIdx].day]=true;
    S.addOpen=false; addToDay(name,S.addCat); render();
  };

  // add booking
  var bb=root.querySelector("[data-addbooking]"); if(bb) bb.onclick=function(){ S.bookOpen=true; S.bookType="Stays"; render(); setTimeout(function(){var n=document.getElementById("booktitle");if(n)n.focus();},50); };
  var bc=root.querySelector("[data-bookcancel]"); if(bc) bc.onclick=function(){ S.bookOpen=false; render(); };
  var bbg=root.querySelector("[data-bookbg]"); if(bbg) bbg.onclick=function(e){ if(e.target===bbg){ S.bookOpen=false; render(); } };
  root.querySelectorAll("[data-booktype]").forEach(function(b){ b.onclick=function(){ S.bookType=b.getAttribute("data-booktype"); render(); }; });
  var bcf=root.querySelector("[data-bookconfirm]"); if(bcf) bcf.onclick=function(){
    var title=(document.getElementById("booktitle").value||"").trim();
    if(!title){ showToast("Give it a title first"); return; }
    var date=(document.getElementById("bookdate").value||"").trim() || "Dates TBD";
    var time=(document.getElementById("booktime").value||"").trim() || "—";
    var conf=(document.getElementById("bookconf").value||"").trim() || "—";
    var addr=(document.getElementById("bookaddr").value||"").trim();
    var catByType={Stays:"hotel",Flights:"transit",Cars:"transit",Ferries:"transit",Buses:"transit",Experiences:"food"};
    S.bookings.push({type:S.bookType, cat:catByType[S.bookType]||"culture", title:title, date:date, time:time, conf:conf, addr:addr});
    S.bookOpen=false; save(); render(); showToast(title+" added to bookings");
  };

  // todos
  root.querySelectorAll("[data-todo]").forEach(function(b){ b.onclick=function(){ var id=b.getAttribute("data-todo"); S.todos.forEach(function(t){ if(t.id===id){ t.done=!t.done; if(t.done)showToast("Booked · "+t.text); } }); save(); render(); }; });

  // dinners
  root.querySelectorAll("[data-dstatus]").forEach(function(b){ b.onclick=function(){ var p=b.getAttribute("data-dstatus").split("|"); setDinnerStatus(p[0],p[1]); }; });
  root.querySelectorAll("[data-dday]").forEach(function(el){ el.onchange=function(){ setDinnerDay(el.getAttribute("data-dday"), el.value); }; });
  root.querySelectorAll("[data-dtime]").forEach(function(el){ el.onchange=function(){ setDinnerTime(el.getAttribute("data-dtime"), el.value); }; });

  // accordions
  root.querySelectorAll("[data-cat]").forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-cat"); var cur=S.openCats[k]; if(cur===undefined){ /* first was default-open only for stays */ cur=(k==="stays"); } S.openCats[k]=!cur; render(); }; });

  // guides add
  root.querySelectorAll("[data-gcity]").forEach(function(b){ b.onclick=function(){
    var gi=+b.getAttribute("data-gcity"), pi=+b.getAttribute("data-gpick");
    var g=GUIDES[gi]; if(!g)return; var p=g.picks[pi]; if(!p)return;
    var idx=-1; for(var i=0;i<S.itin.length;i++){ if(S.itin[i].city===g.city){idx=i;break;} }
    if(idx>=0){ S.dayIdx=idx; S.openDays[S.itin[idx].day]=true; S.tab="trips"; S.sub="plan"; addToDay(p.name,p.cat); render(); scrollActiveDay(); }
    else showToast("No "+g.city+" day found");
  }; });

  // debug
  var dt=root.querySelector("[data-debugtoggle]"); if(dt) dt.onclick=function(){ S._debugOpen=!S._debugOpen; render(); };
  root.querySelectorAll("[data-spoof]").forEach(function(b){ b.onclick=function(){ var v=b.getAttribute("data-spoof"); S.spoof=v||null; S._debugOpen=false; if(S.tab!=="live")S.tab="live"; render(); }; });
}

/* ======================================================= INIT */
function start(){
  initState(); render(); scrollActiveDay();
  // keep the Live tab's NOW/SOON/DONE badges current as real time ticks forward,
  // without re-rendering the rest of the app (avoids disrupting other tabs/inputs)
  setInterval(function(){
    if(S.tab==="live" && !S.addOpen && !S.bookOpen) render();
  }, 20000);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start);
else start();

})();

</script>
</body>
</html>
